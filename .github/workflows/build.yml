
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Depoyu indir
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ZIP dosyasını aç
      - name: Extract Project Zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Proje ZIP dosyası bulunamadı!"
            exit 1
          fi

          echo "ZIP açılıyor: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d .

          if [ ! -f app/build.gradle.kts ]; then
            echo "HATA: app/build.gradle.kts bulunamadı!"
            find . -maxdepth 3 -name build.gradle.kts
            exit 1
          fi

      # 3. Java 17 kur
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Android SDK kur ve lisansları kabul et
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 5. Gradle 9.3.1 kur
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 6. Gradle Wrapper oluştur
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      # 7. Eksik Debug Keystore dosyasını oluştur
      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 8. Android APK derle
      - name: Build APK
        run: |
          ./gradlew assembleDebug --stacktrace

      # 9. APK dosyasını yükle
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASUI-Gorev-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

          
